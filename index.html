<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="index.css" />
  <link rel="icon" type="image/jpeg" href="media/icons/logo.jpeg">
  <title>FR STUDIO</title>
</head>
<body>
  <header class="header">
    <div class="header-container">
      <img src="media/icons/perfil.svg" alt="Logo da gráfica" class="logo" />
      <button class="menu-btn" id="menu-btn" aria-label="Abrir menu" aria-expanded="false">
        <img src="media/icons/menu-bar.svg" alt="">
      </button>
    </div>
  </header>

  <nav class="sidebar" id="sidebar" aria-label="Menu">
    <a href="#" data-nav="inicio">Início</a>
    <a href="#identidade-visual">Portfólio</a>
    <a href="#contato" data-nav="contato">Contato</a>
  </nav>

  <div class="overlay" id="overlay"></div>

  <section class="banner">
    <img src="media/banner.jpeg" alt="Banner fr studio" />
  </section>

  <div class="div-texto-principal">
    <h1 id="typing-text" class="texto-principal"></h1>
    <p id="typing-subtitle" class="sub-texto-principal"></p>

    <a class="ig-btn"
       href="https://www.instagram.com/frstudio.official/"
       target="_blank"
       rel="noopener"
       aria-label="Abrir Instagram @frstudio.oficial">
      <span class="ig-btn__icon" aria-hidden="true">
        <img src="media/icons/instagram.png">
      </span>
      <span class="ig-btn__text">@frstudio.oficial</span>
    </a>
  </div>

  <!-- DESTAQUES -->
  <section class="destaques" aria-label="Destaques">
    <div class="destaques-grid">
      <div class="media-slot media-slot--big">
        <img src="media/cards-principais/loja.jpeg" alt="Loja" />
      </div>
      <div class="media-slot media-slot--small">
        <img src="media/cards-principais/blusa.jpeg" alt="Blusa personalizada" />
      </div>
      <div class="media-slot media-slot--rect">
        <img src="media/cards-principais/bone.jpeg" alt="Boné personalizado" />
      </div>
    </div>
  </section>

  <!-- PORTFÓLIO -->
  <section class="portfolio" id="portfolio" aria-label="Portfólio">
    <div class="section-head">
      <h2 class="section-title">Portfólio</h2>
      <p class="section-subtitle">Clique em um projeto para ver a apresentação completa.</p>
    </div>

    <!-- ===== GRUPO 1 ===== -->
    <div class="portfolio-group" id="identidade-visual" data-pager="2">
      <div class="group-head">
        <h3 class="group-title">Identidade Visual</h3>

        <div class="pager-controls pager-controls--top">
          <button class="pager-btn pager-prev" type="button" aria-label="Voltar projetos">‹</button>
          <button class="pager-btn pager-next" type="button" aria-label="Avançar projetos">›</button>
        </div>
      </div>

      <div class="portfolio-grid" aria-label="Projetos - Identidade Visual">
        <button class="pager-btn pager-btn--side pager-prev" type="button" aria-label="Voltar projetos">‹</button>
        <button class="pager-btn pager-btn--side pager-next" type="button" aria-label="Avançar projetos">›</button>

        <div class="page active">
          <button class="portfolio-card portfolio-card--click" type="button"
            data-expand="media/identidades/picanha-do-canal.jpeg" aria-label="Abrir projeto 1">
            <img src="media/capas/capa-picanha-do-canal.jpeg" alt="Pojeto picanha do canal" />
            <span class="card-badge">Ver projeto</span>
          </button>

          <button class="portfolio-card portfolio-card--click" type="button"
            data-expand="media/identidades/tour-cia.jpeg" aria-label="Projeto tourcia">
            <img src="media/capas/capa-tour-cia.jpeg" alt="Projeto 2 (thumb)" />
            <span class="card-badge">Ver projeto</span>
          </button>
        </div>

        <div class="page">
          <button class="portfolio-card portfolio-card--click" type="button"
            data-expand="media/img.jpeg" aria-label="Abrir projeto 3">
            <img src="media/teste2.png" alt="Projeto 3 (thumb)" />
            <span class="card-badge">Ver projeto</span>
          </button>

          <button class="portfolio-card portfolio-card--click" type="button"
            data-expand="media/img.jpeg" aria-label="Abrir projeto 4">
            <img src="media/teste2.png" alt="Projeto 4 (thumb)" />
            <span class="card-badge">Ver projeto</span>
          </button>
        </div>

        <div class="page">
          <button class="portfolio-card portfolio-card--click" type="button"
            data-expand="media/img.jpeg" aria-label="Abrir projeto 5">
            <img src="media/teste2.png" alt="Projeto 5 (thumb)" />
            <span class="card-badge">Ver projeto</span>
          </button>

          <button class="portfolio-card portfolio-card--click" type="button"
            data-expand="media/img.jpeg" aria-label="Abrir projeto 6">
            <img src="media/teste2.png" alt="Projeto 6 (thumb)" />
            <span class="card-badge">Ver projeto</span>
          </button>
        </div>

        <div class="page">
          <button class="portfolio-card portfolio-card--click" type="button"
            data-expand="media/img.jpeg" aria-label="Abrir projeto 7">
            <img src="media/teste2.png" alt="Projeto 7 (thumb)" />
            <span class="card-badge">Ver projeto</span>
          </button>

          <button class="portfolio-card portfolio-card--click" type="button"
            data-expand="media/img.jpeg" aria-label="Abrir projeto 8">
            <img src="media/teste2.png" alt="Projeto 8 (thumb)" />
            <span class="card-badge">Ver projeto</span>
          </button>
        </div>
      </div>
    </div>

    <!-- ===== GRUPO 2 (exemplo) ===== -->
    <div class="portfolio-group" data-pager="2">
      <div class="group-head">
        <h3 class="group-title">Impressos</h3>

        <div class="pager-controls pager-controls--top">
          <button class="pager-btn pager-prev" type="button" aria-label="Voltar projetos">‹</button>
          <button class="pager-btn pager-next" type="button" aria-label="Avançar projetos">›</button>
        </div>
      </div>

      <div class="portfolio-grid" aria-label="Projetos - Impressos">
        <button class="pager-btn pager-btn--side pager-prev" type="button" aria-label="Voltar projetos">‹</button>
        <button class="pager-btn pager-btn--side pager-next" type="button" aria-label="Avançar projetos">›</button>

        <div class="page active">
          <button class="portfolio-card portfolio-card--click" type="button" data-expand="media/img.jpeg">
            <img src="media/teste2.png" alt="Impressos 1" />
            <span class="card-badge">Ver projeto</span>
          </button>

          <button class="portfolio-card portfolio-card--click" type="button" data-expand="media/expand-picanha.jpg">
            <img src="media/teste2.png" alt="Impressos 2" />
            <span class="card-badge">Ver projeto</span>
          </button>
        </div>

        <div class="page">
          <button class="portfolio-card portfolio-card--click" type="button" data-expand="media/expand-picanha.jpg">
            <img src="media/teste2.png" alt="Impressos 3" />
            <span class="card-badge">Ver projeto</span>
          </button>

          <button class="portfolio-card portfolio-card--click" type="button" data-expand="media/expand-picanha.jpg">
            <img src="media/teste2.png" alt="Impressos 4" />
            <span class="card-badge">Ver projeto</span>
          </button>
        </div>
      </div>
    </div>

  </section>

<!-- MODAL CONTATO (estrutura igual ao modal de projeto) -->
<div class="project-modal" id="contact-modal" aria-hidden="true" role="dialog" aria-modal="true">
  <div class="project-modal__backdrop" data-contact-close="true"></div>

  <div class="project-modal__panel" role="document">
    <div class="project-modal__top">
      <button class="project-modal__close" type="button" id="contact-close" aria-label="Fechar contato">✕</button>
    </div>

    <div class="project-modal__content">
      <div class="contact-box">
        <h3 class="contact-title">Contato</h3>
        <p class="contact-subtitle">Chama no WhatsApp ou fala com a gente no Instagram.</p>

        <a class="contact-whats contact-btn whatsapp"
        href="https://wa.me/5522998589275?text=Olá,%20vim%20pelo%20site%20e%20gostaria%20de%20um%20orçamento."
        target="_blank"
        rel="noopener">
     
       <img src="media/icons/whatsapp.png" alt="WhatsApp">
       <span>+55 (22) 9 9858-9275</span>
     
     </a>

     <a class="contact-ig contact-btn instagram"
     href="https://www.instagram.com/frstudio.official/"
     target="_blank"
     rel="noopener">
  
     <img src="media/icons/instagram.png" alt="Instagram">
     <span>@frstudio.oficial</span>
  
  </a>
      </div>
    </div>
  </div>
</div>

  <!-- ÂNCORA DE CONTATO (pra não quebrar o link do menu) -->
  <div id="contato"></div>

  <section class="bottom-strip" aria-label="Mensagem final">
    <p>Posicionamento não é estética. <br>É poder.</p>
  </section>

  <a href="https://wa.me/5522998589275?text=Olá,%20vim%20pelo%20site%20e%20gostaria%20de%20um%20orçamento."
     class="whatsapp-float"
     target="_blank"
     rel="noopener"
     aria-label="Falar no WhatsApp">
    <img src="media/icons/whatsapp.png" alt="">
  </a>

  <!-- MODAL -->
  <div class="project-modal" id="project-modal" aria-hidden="true" role="dialog" aria-modal="true">
    <div class="project-modal__backdrop" data-close="true"></div>

    <div class="project-modal__panel" role="document">
      <div class="project-modal__top">
        <button class="project-modal__close" type="button" id="project-close" aria-label="Fechar projeto">✕</button>
      </div>

      <div class="project-modal__content">
        <img class="project-modal__image" id="project-image" alt="Projeto expandido" />
      </div>
    </div>
  </div>

  <script src="index.js"></script>
</body>
</html>
