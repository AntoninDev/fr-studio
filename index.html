<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="index.css">
  <title>FR STUDIO</title>
</head>
<body>
  <header class="header">
    <div class="header-container">
      <img src="media/perfil.svg" alt="Logo da gráfica" class="logo">
      <button class="menu-btn" id="menu-btn" aria-label="Abrir menu">☰</button>
    </div>
  </header>

  <nav class="sidebar" id="sidebar" aria-label="Menu">
    <a href="#">Início</a>
    <a href="#">Serviços</a>
    <a href="#portfolio">Portfólio</a>
    <a href="#">Contato</a>
  </nav>

  <div class="overlay" id="overlay"></div>

  <!-- HERO -->
  <section class="banner">
    <img src="media/banner.svg" alt="Exemplo de impressão">
  </section>

  <div class="div-texto-principal">
    <h1 id="typing-text" class="texto-principal"></h1>
    <p id="typing-subtitle" class="sub-texto-principal"></p>

    <!-- Botão Instagram -->
    <a class="ig-btn"
       href="https://www.instagram.com/frstudio.official/"
       target="_blank"
       rel="noopener"
       aria-label="Abrir Instagram @frstudio.oficial">
      <span class="ig-btn__icon" aria-hidden="true">
        <!-- Ícone Instagram -->
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path d="M7 2h10a5 5 0 0 1 5 5v10a5 5 0 0 1-5 5H7a5 5 0 0 1-5-5V7a5 5 0 0 1 5-5zm10 2H7a3 3 0 0 0-3 3v10a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3V7a3 3 0 0 0-3-3zm-5 4.5A5.5 5.5 0 1 1 6.5 14 5.5 5.5 0 0 1 12 8.5zm0 2A3.5 3.5 0 1 0 15.5 14 3.5 3.5 0 0 0 12 10.5zM18 6.8a1.2 1.2 0 1 1-1.2 1.2A1.2 1.2 0 0 1 18 6.8z"
                fill="currentColor"/>
        </svg>
      </span>
      <span class="ig-btn__text">@frstudio.oficial</span>
    </a>
  </div>

  <!-- DESTAQUES (3 cards: grande, pequeno e retangular) -->
  <section class="destaques" aria-label="Destaques">
    <div class="destaques-grid">
      <div class="media-slot media-slot--big" aria-label="Destaque grande (imagem)">
        <img src="media/teste.png" alt="imgteste">
      </div>
      <div class="media-slot media-slot--small" aria-label="Destaque pequeno (imagem)">
        <img src="media/teste.png" alt="imgteste">
        
      </div>
      <div class="media-slot media-slot--rect" aria-label="Destaque retangular (imagem)">
        <img src="media/teste.png" alt="imgteste">
        
      </div>
    </div>
  </section>
  
  <!-- PORTFÓLIO -->
  <section class="portfolio" id="portfolio" aria-label="Portfólio">
    <div class="section-head">
      <h2 class="section-title">Portfólio</h2>
      <p class="section-subtitle">Temos aqui uma pequena coletânea dos nossos trabalhos.</p>
    </div>
    
    <div class="portfolio-group">
      <h3 class="group-title">Identidade Visual</h3>
      <div class="portfolio-grid">
        <div class="portfolio-card" aria-label="Identidade Visual 1 (imagem)">
          <img src="media/teste2.png" alt="imgteste">
        </div>
        <div class="portfolio-card" aria-label="Identidade Visual 2 (imagem)">
          <img src="media/teste2.png" alt="imgteste">
        </div>
        <div class="portfolio-card" aria-label="Identidade Visual 3 (imagem)">
          <img src="media/teste2.png" alt="imgteste">
        </div>
      </div>
    </div>
    
    <div class="portfolio-group">
      <h3 class="group-title">Impressos</h3>
      <div class="portfolio-grid">
        <div class="portfolio-card" aria-label="Impressos 1 (imagem)">
          <img src="media/teste2.png" alt="imgteste">
        </div>
        <div class="portfolio-card" aria-label="Impressos 2 (imagem)">
          <img src="media/teste2.png" alt="imgteste">
        </div>
        <div class="portfolio-card" aria-label="Impressos 3 (imagem)">
          <img src="media/teste2.png" alt="imgteste">
        </div>
      </div>
    </div>
    
    <div class="portfolio-group">
      <h3 class="group-title">Social Media</h3>
      <div class="portfolio-grid">
        <div class="portfolio-card" aria-label="Social Media 1 (imagem)">
          <img src="media/teste2.png" alt="imgteste">
        </div>
        <div class="portfolio-card" aria-label="Social Media 2 (imagem)">
          <img src="media/teste2.png" alt="imgteste">
        </div>
        <div class="portfolio-card" aria-label="Social Media 3 (imagem)">
          <img src="media/teste2.png" alt="imgteste">
        </div>
      </div>
    </div>
  </section>

  <!-- Faixa final -->
  <section class="bottom-strip" aria-label="Mensagem final">
    <p>Posicionamento não é estética. <br>É poder.</p>
  </section>

  
  <!-- BOTÃO WHATSAPP FLUTUANTE -->
  <a href="https://wa.me/5522998589275?text=Olá,%20vim%20pelo%20site%20e%20gostaria%20de%20um%20orçamento."
  class="whatsapp-float"
  target="_blank"
  rel="noopener"
  aria-label="Falar no WhatsApp">
  <img src="media/icon-zap.png" alt="">
</a>
<script src="index.js"></script>
</body>
</html>
