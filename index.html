<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="index.css" />
  <title>FR STUDIO</title>
</head>
<body>
  <header class="header">
    <div class="header-container">
      <img src="media/perfil.svg" alt="Logo da gráfica" class="logo" />
      <button class="menu-btn" id="menu-btn" aria-label="Abrir menu" aria-expanded="false">☰</button>
    </div>
  </header>

  <nav class="sidebar" id="sidebar" aria-label="Menu">
    <a href="#">Início</a>
    <a href="#">Serviços</a>
    <a href="#portfolio">Portfólio</a>
    <a href="#">Contato</a>
  </nav>

  <div class="overlay" id="overlay"></div>

  <section class="banner">
    <img src="media/banner.svg" alt="Exemplo de impressão" />
  </section>

  <div class="div-texto-principal">
    <h1 id="typing-text" class="texto-principal"></h1>
    <p id="typing-subtitle" class="sub-texto-principal"></p>

    <a class="ig-btn"
       href="https://www.instagram.com/frstudio.official/"
       target="_blank"
       rel="noopener"
       aria-label="Abrir Instagram @frstudio.oficial">
      <span class="ig-btn__icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path d="M7 2h10a5 5 0 0 1 5 5v10a5 5 0 0 1-5 5H7a5 5 0 0 1-5-5V7a5 5 0 0 1 5-5zm10 2H7a3 3 0 0 0-3 3v10a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3V7a3 3 0 0 0-3-3zm-5 4.5A5.5 5.5 0 1 1 6.5 14 5.5 5.5 0 0 1 12 8.5zm0 2A3.5 3.5 0 1 0 15.5 14 3.5 3.5 0 0 0 12 10.5zM18 6.8a1.2 1.2 0 1 1-1.2 1.2A1.2 1.2 0 0 1 18 6.8z"
                fill="currentColor"/>
        </svg>
      </span>
      <span class="ig-btn__text">@frstudio.oficial</span>
    </a>
  </div>

  <!-- DESTAQUES -->
  <section class="destaques" aria-label="Destaques">
    <div class="destaques-grid">
      <div class="media-slot media-slot--big">
        <img src="media/teste.png" alt="imgteste" />
      </div>
      <div class="media-slot media-slot--small">
        <img src="media/teste.png" alt="imgteste" />
      </div>
      <div class="media-slot media-slot--rect">
        <img src="media/teste.png" alt="imgteste" />
      </div>
    </div>
  </section>

  <!-- PORTFÓLIO -->
  <section class="portfolio" id="portfolio" aria-label="Portfólio">
    <div class="section-head">
      <h2 class="section-title">Portfólio</h2>
      <p class="section-subtitle">Clique em um projeto para ver a apresentação completa.</p>
    </div>

    <!-- ===== GRUPO 1 ===== -->
    <div class="portfolio-group" data-pager="2">
      <div class="group-head">
        <h3 class="group-title">Identidade Visual</h3>

        <div class="pager-controls">
          <button class="pager-btn pager-prev" type="button" aria-label="Voltar projetos">‹</button>
          <button class="pager-btn pager-next" type="button" aria-label="Avançar projetos">›</button>
        </div>
      </div>

      <div class="portfolio-grid">
        <!-- PAGE 0 (2 cards) -->
        <div class="page active">
          <button class="portfolio-card portfolio-card--click" type="button"
            data-expand="media/img.jpeg" aria-label="Abrir projeto 1">
            <img src="media/teste2.png" alt="Projeto 1 (thumb)" />
            <span class="card-badge">Ver projeto</span>
          </button>

          <button class="portfolio-card portfolio-card--click" type="button"
            data-expand="media/img.jpeg" aria-label="Abrir projeto 2">
            <img src="media/teste2.png" alt="Projeto 2 (thumb)" />
            <span class="card-badge">Ver projeto</span>
          </button>
        </div>

        <!-- PAGE 1 (mais 2 cards) -->
        <div class="page">
          <button class="portfolio-card portfolio-card--click" type="button"
            data-expand="media/img.jpeg" aria-label="Abrir projeto 3">
            <img src="media/teste2.png" alt="Projeto 3 (thumb)" />
            <span class="card-badge">Ver projeto</span>
          </button>

          <button class="portfolio-card portfolio-card--click" type="button"
            data-expand="media/img.jpeg" aria-label="Abrir projeto 4">
            <img src="media/teste2.png" alt="Projeto 4 (thumb)" />
            <span class="card-badge">Ver projeto</span>
          </button>
        </div>
      </div>
    </div>

    <!-- ===== GRUPO 2 (exemplo) ===== -->
    <div class="portfolio-group" data-pager="2">
      <div class="group-head">
        <h3 class="group-title">Impressos</h3>

        <div class="pager-controls">
          <button class="pager-btn pager-prev" type="button" aria-label="Voltar projetos">‹</button>
          <button class="pager-btn pager-next" type="button" aria-label="Avançar projetos">›</button>
        </div>
      </div>

      <div class="portfolio-grid">
        <div class="page active">
          <button class="portfolio-card portfolio-card--click" type="button"
            data-expand="media/img.jpeg">
            <img src="media/teste2.png" alt="Impressos 1" />
            <span class="card-badge">Ver projeto</span>
          </button>

          <button class="portfolio-card portfolio-card--click" type="button"
            data-expand="media/expand-picanha.jpg">
            <img src="media/teste2.png" alt="Impressos 2" />
            <span class="card-badge">Ver projeto</span>
          </button>
        </div>

        <div class="page">
          <button class="portfolio-card portfolio-card--click" type="button"
            data-expand="media/expand-picanha.jpg">
            <img src="media/teste2.png" alt="Impressos 3" />
            <span class="card-badge">Ver projeto</span>
          </button>

          <button class="portfolio-card portfolio-card--click" type="button"
            data-expand="media/expand-picanha.jpg">
            <img src="media/teste2.png" alt="Impressos 4" />
            <span class="card-badge">Ver projeto</span>
          </button>
        </div>
      </div>
    </div>

  </section>

  <section class="bottom-strip" aria-label="Mensagem final">
    <p>Posicionamento não é estética. <br>É poder.</p>
  </section>

  <a href="https://wa.me/5522998589275?text=Olá,%20vim%20pelo%20site%20e%20gostaria%20de%20um%20orçamento."
     class="whatsapp-float"
     target="_blank"
     rel="noopener"
     aria-label="Falar no WhatsApp">
    <img src="media/icon-zap.png" alt="">
  </a>

  <!-- MODAL -->
  <div class="project-modal" id="project-modal" aria-hidden="true" role="dialog" aria-modal="true">
    <div class="project-modal__backdrop" data-close="true"></div>

    <div class="project-modal__panel" role="document">
      <div class="project-modal__top">
        <button class="project-modal__close" type="button" id="project-close" aria-label="Fechar projeto">✕</button>
      </div>

      <div class="project-modal__content">
        <img class="project-modal__image" id="project-image" alt="Projeto expandido" />
      </div>
    </div>
  </div>

  <script src="index.js"></script>
</body>
</html>
